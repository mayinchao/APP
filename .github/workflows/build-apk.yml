name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          cp Frontend/requirements.txt .
          pip install -r requirements.txt
      - run: cp Frontend/app.py .
      - run: cp Frontend/navigation_bars.py .
      - run: sed -i 's/alignment\.center/ft.alignment.CENTER/g' app.py
      - run: sed -i 's/Geolocator/None/g' app.py
      - run: sed -i 's/from flet import (.*)/from flet import Page, Container, Row, Column, IconButton, Text, PopupMenuButton, PopupMenuItem, Icon, Stack, alignment, border_radius, Colors, ScrollMode, Card, Image, ElevatedButton, TextField, Switch, SnackBar, Divider, ListView, AlertDialog, TextButton, ListTile/g' app.py
      - run: |
          echo 'import flet as ft' > main.py
          echo 'from app import PlantApp' >> main.py
          echo '' >> main.py
          echo 'def main(page: ft.Page):' >> main.py
          echo '    page.title = "滇菌智护"' >> main.py
          echo '    page.bgcolor = ft.Colors.LIGHT_GREEN_50' >> main.py
          echo '    app = PlantApp(page)' >> main.py
          echo '' >> main.py
          echo 'ft.app(target=main)' >> main.py
      - run: echo "y" | flet build apk
      - uses: actions/upload-artifact@v4
        with:
          name: plant-app
          path: build/apk/*.apk
