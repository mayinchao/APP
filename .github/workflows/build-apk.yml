name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          cp Frontend/requirements.txt .
          pip install -r requirements.txt
      - run: cp Frontend/app.py .
      - run: cp Frontend/navigation_bars.py .
      - run: |
          # 修复 alignment
          sed -i 's/alignment\.center/ft.alignment.CENTER/g' app.py
          # 注释掉 Geolocator 相关代码
          sed -i 's/from flet import (.*Geolocator.*)/# Geolocator removed/g' app.py
          sed -i 's/from flet import Geolocator/# Geolocator removed/g' app.py
          sed -i 's/self\.geolocator = Geolocator()/self.geolocator = None/g' app.py
          sed -i 's/from flet_geolocator/# Geolocator disabled/g' app.py
      - run: |
          echo 'import flet as ft' > main.py
          echo 'from app import PlantApp' >> main.py
          echo '' >> main.py
          echo 'def main(page: ft.Page):' >> main.py
          echo '    page.title = "滇菌智护"' >> main.py
          echo '    page.bgcolor = ft.Colors.LIGHT_GREEN_50' >> main.py
          echo '    app = PlantApp(page)' >> main.py
          echo '' >> main.py
          echo 'ft.app(target=main)' >> main.py
      - run: echo "y" | flet build apk
      - uses: actions/upload-artifact@v4
        with:
          name: plant-app
          path: build/apk/*.apk
